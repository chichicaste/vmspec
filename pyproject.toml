[project]
name = "vmspec"
version = "0.1.0"
description = "VM deobfuscation via automated SLEIGH spec generation (VMSpec implementation)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "chichicaste", email = "migher@gmail.com" }]
dependencies = [
    "angr>=9.2,<10",
    # pyvex uses bitstring.ConstBitStream, removed in bitstring >= 4.0.
    "bitstring<4",
    # angr's sim_type uses pycparser's CLexer, removed in pycparser >= 3.0.
    "pycparser<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vmspec"]

# Note: angr's pydemumble dependency resolves to 0.1.1 (no Windows wheel) on
# Python <3.12 and 0.1.3 (has win_amd64 wheel) on Python >=3.12. Pin to 3.12.
